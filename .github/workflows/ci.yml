name: CI

# One job per area. Each job filters on its own paths so a change in one service
# doesn't rerun the others. Add a new job (and filter) per service under services/.
on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "packages/healthcare-ai-core/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "packages/healthcare-ai-core/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: packages/healthcare-ai-core/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/healthcare-ai-core[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type check with Mypy
        working-directory: packages/healthcare-ai-core
        run: |
          mypy src

      - name: Run tests with pytest
        working-directory: packages/healthcare-ai-core
        run: |
          pytest --cov=healthcare_ai --cov-report=xml
