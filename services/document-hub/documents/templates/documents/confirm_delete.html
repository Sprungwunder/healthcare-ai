{% extends "documents/base.html" %}
{% block title %}Delete{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Delete document?</h1>
  <p>“<strong>{{ document.title }}</strong>” and the file <em>{{ document.original_filename }}</em> will be deleted permanently. This cannot be undone.</p>
  <form method="post" class="form-actions">
    {% csrf_token %}
    <button type="submit" class="button danger">Delete permanently</button>
    <a class="button" href="{{ document.get_absolute_url }}">Cancel</a>
  </form>
</section>
{% endblock %}
