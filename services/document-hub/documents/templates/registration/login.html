{% extends "documents/base.html" %}
{% block title %}Anmelden{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Anmelden</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="form-errors">{{ form.non_field_errors }}</div>{% endif %}
    <div class="field">
      <label for="id_username">Benutzername</label>
      <input type="text" name="username" id="id_username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}">
    </div>
    <div class="field">
      <label for="id_password">Passwort</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="button primary">Anmelden</button>
  </form>
</section>
{% endblock %}
