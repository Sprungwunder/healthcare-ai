[project]
name = "document-hub"
version = "0.1.0"
description = "Healthcare Document Hub: manage medical and lab documents (files + metadata)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "healthcare-ai",
    "django>=6.0,<6.1",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "drf-spectacular-sidecar>=2025.1",
    "dj-database-url>=2.3",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
    "whitenoise>=6.9",
    "django-stubs-ext>=6.0,<6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=6.0,<6.1",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
]

[tool.uv]
package = false

# uv rejects relative `file:` URLs in PEP 508 strings, so the local path
# dependency on core is declared here instead (same effect as
# `healthcare-ai @ file:../../packages/healthcare-ai-core`).
[tool.uv.sources]
healthcare-ai = { path = "../../packages/healthcare-ai-core", editable = true }

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py312"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "document_hub.settings_test"
testpaths = ["tests"]
addopts = "-ra -q"
markers = ["slow: runs a manage.py subprocess"]

[tool.coverage.run]
source = ["document_hub", "documents"]
omit = ["*/migrations/*", "document_hub/asgi.py", "document_hub/wsgi.py"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = ["^\\.venv/", "/migrations/"]

[[tool.mypy.overrides]]
module = ["dj_database_url.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "document_hub.settings_test"

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
