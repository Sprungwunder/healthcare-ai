# Repo-wide tooling config. Not a package: each project lives under packages/ or
# services/ with its own pyproject.toml. Ruff finds this file from any subdirectory
# (pyproject files without [tool.ruff] are skipped), so lint/format rules are shared.

[tool.ruff]
line-length = 88
target-version = "py310"
# Where first-party code lives, so isort classifies e.g. `healthcare_ai` correctly.
src = ["packages/*/src", "services/*", "services/*/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = []
